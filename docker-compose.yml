services:
  oracle23ai:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle23ai_ewallet
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Oracle23ai}
      ORACLE_CHARACTERSET: AL32UTF8
      NLS_LANG: AMERICAN_AMERICA.AL32UTF8
    volumes:
      - oracle23ai_data:/opt/oracle/oradata
      - ./sql:/opt/oracle/user_sql:ro
      - ./docker/init:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s sys/${ORACLE_PWD:-Oracle23ai}@//localhost:1521/FREEPDB1 as sysdba | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  oracle23ai_data:
    driver: local
